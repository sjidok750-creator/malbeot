<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>말벗 회화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app — slim header, video-call style character stage, scene strip, chat log, composer pinned to the bottom. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#172031; --muted:#5a6476; --line:#d8dde7;
  --me:#2b5ce6; --me-ink:#ffffff; --chip:#e3e8f1; --chip-ink:#2a3446; --chip-on:#172031; --chip-on-ink:#ffffff;
  --fix-bg:#fff3d4; --fix-ink:#5a3e00; --fix-line:#ead08c; --focus:#2b5ce6; --scrim:rgba(9,13,21,.46);
  --go:#1f9d55; --stop:#d64545;
  --display:"Jua","Zen Maru Gothic",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ja:"Zen Maru Gothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1118; --surface:#161c27; --surface-2:#1c2330; --ink:#e6eaf1; --muted:#9aa3b3; --line:#283041;
  --me:#3f6ef0; --me-ink:#ffffff; --chip:#222a38; --chip-ink:#d5dbe6; --chip-on:#e6eaf1; --chip-on-ink:#111722;
  --fix-bg:#33290f; --fix-ink:#f3d58c; --fix-line:#5a4818; --focus:#86a6ff; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1118; --surface:#161c27; --surface-2:#1c2330; --ink:#e6eaf1; --muted:#9aa3b3; --line:#283041;
  --me:#3f6ef0; --me-ink:#ffffff; --chip:#222a38; --chip-ink:#d5dbe6; --chip-on:#e6eaf1; --chip-on-ink:#111722;
  --fix-bg:#33290f; --fix-ink:#f3d58c; --fix-line:#5a4818; --focus:#86a6ff; --scrim:rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
:lang(ja){font-family:var(--ja)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){.app{border-inline:1px solid var(--line)}}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:10px 16px 8px}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;padding:4px 6px 4px 0;text-align:left;border-radius:14px}
.thumb{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;background:linear-gradient(160deg,var(--a,#ddd),var(--b,#bbb))}
.thumb svg{width:100%;height:100%;display:block}
.thumb img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 45%;transform:scale(1.7);transform-origin:49% 47%}
.who-text{display:flex;flex-direction:column;min-width:0}
.who-name{font-family:var(--display);font-size:19px;line-height:1.15}
.who-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caret{color:var(--muted);display:flex}
.top-actions{display:flex;align-items:center;gap:4px;flex:none}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.iconbtn.soft{background:var(--chip);color:var(--chip-ink);flex:none;width:42px;height:42px}
.iconbtn.soft[aria-expanded="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.badge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--me);color:var(--me-ink);font-size:10.5px;line-height:17px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}

/* stage */
.stage{position:relative;margin:0 16px;border-radius:24px;overflow:hidden;height:clamp(170px,34dvh,330px);flex:none;
  background:radial-gradient(120% 90% at 50% 18%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),linear-gradient(165deg,var(--a),var(--b))}
.stage-av{position:absolute;inset:6% 0 0 0;display:flex;justify-content:center}
.stage-av svg{height:100%;width:auto;display:block}
.stage-av.is-photo{inset:0}
.stage-av.is-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;transform-origin:50% 45%;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.stage.speaking .stage-av.is-photo img{animation:talk .42s ease-in-out infinite alternate}
@keyframes talk{from{transform:scale(1.01) translateY(0)}to{transform:scale(1.03) translateY(-1.5px)}}
.stage.thinking .stage-av.is-photo img{filter:saturate(.85) brightness(.96)}
.stage::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,255,255,0);transition:box-shadow .3s}
.stage.speaking::after{box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),inset 0 0 28px rgba(255,255,255,.35)}
.tag{position:absolute;font-size:12px;border-radius:999px;padding:4px 10px;background:rgba(12,16,26,.58);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tag-lang{top:12px;left:12px}
.tag-status{top:12px;right:12px;display:flex;align-items:center;gap:6px}
.tag-name{left:12px;bottom:12px;font-size:13px;font-weight:500}
.tag-name b{font-family:var(--display);font-weight:400;font-size:15px}
.wave{display:inline-flex;gap:2px;align-items:center;height:12px}
.wave i{width:3px;height:100%;border-radius:2px;background:#fff;animation:wave .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.tag-status[data-s="think"] .wave i{height:4px;border-radius:50%;width:4px;animation:hop 1s ease-in-out infinite}
.tag-status[data-s="think"] .wave i:nth-child(2){animation-delay:.15s}.tag-status[data-s="think"] .wave i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,100%{transform:translateY(2px);opacity:.5}50%{transform:translateY(-2px);opacity:1}}

/* scenes */
.scenes{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none;flex:none}
.scenes::-webkit-scrollbar{display:none}
.scene{flex:none;border:0;border-radius:999px;padding:6px 13px;background:var(--chip);color:var(--chip-ink);font-size:13.5px;white-space:nowrap}
.scene[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);font-weight:500}

/* log */
.log{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.log-intro{align-self:center;font-size:12px;color:var(--muted);margin:2px 0 0}
.msg{max-width:88%;min-width:0;overflow-wrap:anywhere}
.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 12px 6px}
.t{font-size:17px;line-height:1.6}
.t:lang(ja){line-height:1.9}
ruby{ruby-align:center}
ruby rt{font-size:.52em;color:var(--muted);font-weight:500}
.reading{font-size:13px;color:var(--muted);margin-top:2px}
.ko{font-size:13.5px;color:var(--muted);margin-top:4px}
.acts{display:flex;align-items:center;gap:2px;margin:6px -6px 0}
.act{height:32px;min-width:32px;padding:0 7px;border:0;border-radius:16px;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.act:hover{background:var(--surface-2);color:var(--ink)}
.act[aria-pressed="true"]{color:var(--me)}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vchip{display:inline-flex;align-items:stretch;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;max-width:100%}
.vchip button{border:0;background:none;padding:4px 8px;font-size:13px;text-align:left;min-width:0}
.vchip .vw{font-weight:600}
.vchip .vr{color:var(--muted);font-size:11.5px;margin-left:4px}
.vchip .vk{color:var(--muted);margin-left:6px}
.vchip .vs{border-left:1px solid var(--line);color:var(--muted);display:grid;place-items:center;padding:0 7px}
.vchip .vs[aria-pressed="true"]{color:var(--me)}
.me-wrap{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:88%;min-width:0}
.me{background:var(--me);color:var(--me-ink);border-radius:18px 18px 6px 18px;padding:9px 13px;font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}
.fix{background:var(--fix-bg);color:var(--fix-ink);border:1px solid var(--fix-line);border-radius:14px;padding:8px 12px 4px;font-size:14px;min-width:0;max-width:100%}
.fix-label{font-size:11.5px;font-weight:600;letter-spacing:.04em}
.fix-better{font-size:16px;font-weight:500;line-height:1.55;margin-top:2px}
.fix-why{font-size:13px;margin-top:3px;opacity:.9}
.fix .act{color:inherit;opacity:.8}
.fix .act[aria-pressed="true"]{opacity:1}
.pending{display:flex;gap:5px;padding:14px 14px}
.pending i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:hop 1s ease-in-out infinite}
.pending i:nth-child(2){animation-delay:.15s}.pending i:nth-child(3){animation-delay:.3s}
.note{align-self:center;text-align:center;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:92%}
.note-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.btn.primary{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}

/* bottom */
.hints{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;flex:none;border-top:1px solid var(--line);background:var(--surface-2);scrollbar-width:none}
.hint{flex:none;max-width:78%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 11px;text-align:left;display:flex;flex-direction:column}
.hint .ht{font-size:14.5px;font-weight:500;white-space:normal}
.hint .hr{font-size:11.5px;color:var(--muted)}
.hint .hk{font-size:12px;color:var(--muted)}
.banner{flex:none;margin:0 16px 8px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink)}
.foot{flex:none;background:var(--surface);border-top:1px solid var(--line)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 16px}
.composer textarea{box-sizing:border-box;flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:21px;padding:9px 14px;font-size:16px;line-height:1.4;max-height:124px;overflow-y:hidden;background:var(--surface-2);color:var(--ink)}
.composer textarea::placeholder{color:var(--muted)}
.sendbtn{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--me);color:var(--me-ink);display:grid;place-items:center}
.sendbtn:disabled{opacity:.4;cursor:default}
.sendbtn[data-busy="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.tip{margin:0;padding:0 16px 8px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.tip svg{flex:none;margin-top:1px}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:21;background:var(--surface);color:var(--ink);
  border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:82%;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);padding:10px 0 6px;z-index:1}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:21px}
.grp{margin:10px 0 4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:10px;text-align:left;min-width:0}
.card[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.card .cav{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(165deg,var(--a),var(--b));display:flex;justify-content:center;align-items:flex-end}
.card .cav svg{height:100%;width:auto}
.card .cav img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
.card .cn{font-family:var(--display);font-size:18px;line-height:1.1}
.card .cs{font-size:12px;color:var(--muted)}
.card .cd{font-size:12.5px;line-height:1.45}
.field{padding:12px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.flabel{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button b{font-size:14.5px}
.seg button small{font-size:11px;color:var(--muted)}
.seg button[aria-checked="true"],.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.seg button[aria-checked="true"] small,.seg button[aria-pressed="true"] small{color:inherit;opacity:.75}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:14.5px}
.row small{color:var(--muted);font-size:12px;margin-left:4px}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--me);flex:none}
.row.col{flex-direction:column;align-items:stretch;gap:6px}
.row.col span{display:flex;justify-content:space-between}
.row input[type=range]{width:100%;accent-color:var(--me)}
.fhint{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.wide{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px;font-size:14px;font-weight:500}
.wide.danger{color:#c03b3b}
.notes{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.notes li{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.notes .nt{flex:1;min-width:0}
.notes .nx{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.notes .nr,.notes .nk{font-size:12.5px;color:var(--muted)}
.empty{font-size:13.5px;color:var(--muted);text-align:center;padding:18px 8px;margin:0}

/* call mode */
.modeseg{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.modeseg button{width:34px;height:30px;border:0;border-radius:999px;background:none;color:var(--chip-ink);display:grid;place-items:center}
.modeseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.subtitle{display:none}
.app.call .subtitle{display:flex;flex-direction:column;gap:2px;position:absolute;left:12px;right:12px;bottom:12px;max-height:58%;overflow-y:auto;background:rgba(10,14,22,.64);color:#fff;border-radius:16px;padding:10px 12px 4px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .2s}
.app.call .stage.thinking .subtitle{opacity:.55}
.subtitle .st{font-size:18px;line-height:1.55}
.subtitle .st:lang(ja){line-height:1.9}
.subtitle rt{color:rgba(255,255,255,.78)}
.subtitle .sk{font-size:13.5px;color:rgba(255,255,255,.82)}
.subtitle .acts{margin:4px -6px 0}
.subtitle .act{color:rgba(255,255,255,.85)}
.subtitle .act:hover{background:rgba(255,255,255,.12);color:#fff}
.subtitle .act[aria-pressed="true"]{color:#ffd166}
.app.call .stage{flex:1 1 auto;height:auto;min-height:220px}
.app.call .log,.app.call .tag-name{display:none}
.myline{display:none}
.app.call .myline{display:flex;flex-direction:column;gap:6px;padding:8px 16px 6px;flex:none;max-height:38%;overflow-y:auto}
.app.call .myline:empty{display:none}
.myline .me-wrap{max-width:92%}
.myline .note{align-self:center}
.composer textarea.yourturn{border-color:var(--me);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(63,110,240,.45)}100%{box-shadow:0 0 0 10px rgba(63,110,240,0)}}
.sendbtn{position:relative}
.sendbtn.arming::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--me);animation:arm var(--arm,1.8s) linear forwards}
@keyframes arm{from{transform:scale(.7);opacity:.1}to{transform:scale(1);opacity:.95}}
/* hands-free (standalone page) */
.callbtn{display:none;flex:1;min-width:0;height:46px;border:0;border-radius:23px;background:var(--go);color:#fff;font-weight:600;font-size:16px;align-items:center;justify-content:center;gap:8px}
.callbtn[data-on="true"]{background:var(--stop)}
.callbtn:disabled{opacity:.45;cursor:default}
.app.handsfree .callbtn{display:flex}
.app.handsfree #msg,.app.handsfree #sendBtn{display:none}
.live{flex:none;margin:0 16px 8px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.live .lt{font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.live .ls{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--stop);animation:blink 1.2s ease-in-out infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
.live .bar{height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.live .bar i{display:block;height:100%;width:100%;background:var(--me);transform-origin:left;animation:fill var(--wait,3s) linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.row.col input[type=password],.row.col select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface-2);color:var(--ink);font-size:15px}
/* reports */
#noteMode{margin:2px 0 10px}
#paneReports{display:flex;flex-direction:column;gap:10px}
#paneReports[hidden]{display:none}
#paneReports .grp{margin:8px 0 0}
.rcard{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;min-width:0}
.rcard .rmeta{font-size:12px;color:var(--muted)}
.rcard .rsum{font-size:14.5px;line-height:1.6}
.rsec{display:flex;flex-direction:column;gap:6px}
.rsec h3{margin:0;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.ritem{display:flex;align-items:flex-start;gap:6px;min-width:0}
.ritem .rt{flex:1;min-width:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.ritem .rx{font-size:15.5px;font-weight:500}
.ritem .rs{color:var(--muted);text-decoration:line-through;font-size:13px}
.ritem .rk{color:var(--muted);font-size:12.5px}
.rgoal{font-size:14px;background:var(--fix-bg);color:var(--fix-ink);border:1px solid var(--fix-line);border-radius:10px;padding:8px 10px}
.rwait{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:6px 2px}
.rwait i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:hop 1s ease-in-out infinite}
.rwait i:nth-child(2){animation-delay:.15s}.rwait i:nth-child(3){animation-delay:.3s}

/* ---------- conversation reports + what the teacher remembers ---------- */
const LIST = (items) => ({ type: 'array', items });
const REPORT_SCHEMA = obj({
  summary_ko: STR,
  mistakes: LIST(obj({ said: STR, better: STR, why_ko: STR })),
  expressions: LIST(obj({ text: STR, reading: STR, ko: STR })),
  next_goal_ko: STR,
  profile: obj({ level_ko: STR, mistakes: LIST(STR), interests: LIST(STR), note_ko: STR }),
});
let reportBusy = false, reportErr = '', reportView = null;
function newTurns(key = logKey()) {
  const log = getLog(key), mark = Number(S.reportMark[key]) || 0;
  return log.slice(mark).filter(m => m.who === 'me').length;
}
function buildReportPrompt(c, sc, log, mark) {
  const lang = c.lang === 'en' ? 'English' : 'Japanese';
  const from = Math.max(0, mark - 1);
  const hist = log.slice(from).slice(-40).map(m => (m.who === 'me' ? 'Learner' : c.n) + ': ' + m.text + (m.fix ? '   [suggested: ' + m.fix.better + ']' : ''));
  const prev = S.profile[c.lang] || {};
  return [
    `You are a language coach. Write a short report for a Korean learner of ${lang} after a practice conversation with the character ${c.n}.`,
    `Scene: ${sc.role}`,
    `Learner level setting: ${LV[S.level].p[c.lang]}`,
    'PREVIOUS LEARNER PROFILE (may be empty): ' + JSON.stringify({ level_ko: prev.level_ko || '', mistakes: prev.mistakes || [], interests: prev.interests || [], note_ko: prev.note_ko || '' }),
    '',
    'CONVERSATION (this session):',
    ...hist,
    '',
    `Write everything in Korean except quoted ${lang} phrases.`,
    '- summary_ko: 2-3 sentences on what was talked about and how the learner did (encouraging but honest).',
    `- mistakes: up to 5 of the learner's most important mistakes in this session. said = exactly what the learner said, better = a natural ${lang} version, why_ko = one short reason. Skip typos, punctuation and capitalisation. Empty if none.`,
    `- expressions: exactly 5 useful ${lang} expressions from this conversation or ones the learner needed, with Korean meaning; reading = hiragana for Japanese, "" for English.`,
    '- next_goal_ko: one concrete goal for next time.',
    '- profile: the UPDATED learner profile combining the previous profile with this session: level_ko (one short phrase), mistakes (up to 6 recurring weak points, short Korean phrases with a tiny example), interests (up to 6 short topics the learner talked about), note_ko (one sentence on how to teach this learner).',
    'Reply with only one JSON object with the keys summary_ko, mistakes, expressions, next_goal_ko, profile.',
  ].join('\n');
}
function cleanReport(r) {
  const str = v => (typeof v === 'string' ? v.trim() : '');
  const arr = v => (Array.isArray(v) ? v : []);
  if (!r || typeof r !== 'object' || !str(r.summary_ko)) throw { code: 'invalid_json' };
  const pf = r.profile && typeof r.profile === 'object' ? r.profile : {};
  return {
    summary: str(r.summary_ko),
    mistakes: arr(r.mistakes).filter(m => m && str(m.better)).slice(0, 5).map(m => ({ said: str(m.said), better: str(m.better), why: str(m.why_ko) })),
    expressions: arr(r.expressions).filter(x => x && str(x.text)).slice(0, 6).map(x => ({ text: str(x.text), reading: str(x.reading), ko: str(x.ko) })),
    goal: str(r.next_goal_ko),
    profile: { level_ko: str(pf.level_ko), mistakes: arr(pf.mistakes).map(str).filter(Boolean).slice(0, 6), interests: arr(pf.interests).map(str).filter(Boolean).slice(0, 6), note_ko: str(pf.note_ko) },
  };
}
async function makeReport() {
  if (reportBusy) return;
  const key = logKey(), c = CH(), sc = SC(), log = getLog(key);
  const mark = Number(S.reportMark[key]) || 0;
  if (!newTurns(key)) { reportErr = '리포트로 정리할 새 대화가 아직 없어요.'; renderReports(); return; }
  const backend = await getBackend();
  if (!backend) { reportErr = IN_CLAUDE ? '여기서는 Claude에 연결되지 않아요.' : '설정에서 API 키를 먼저 넣어 주세요.'; renderReports(); return; }
  reportBusy = true; reportErr = ''; reportView = null; renderReports();
  try {
    const raw = await backend(buildReportPrompt(c, sc, log, mark), { schema: REPORT_SCHEMA, suffix: '', tier: 'default' });
    const rp = cleanReport(raw);
    const item = { id: Date.now(), ts: Date.now(), char: S.char, scene: S.scene, lang: c.lang, ...rp };
    S.reports.unshift(item);
    if (S.reports.length > 40) S.reports.length = 40;
    if (rp.profile.level_ko || rp.profile.mistakes.length || rp.profile.interests.length) S.profile[c.lang] = rp.profile;
    S.reportMark[key] = log.length;
    save(); reportView = item.id;
  } catch (e) {
    const code = (e && e.code) || 'upstream_error';
    reportErr = code === 'bad_request' ? 'Claude 서버가 요청을 거절했어요: ' + String((e && e.message) || '').slice(0, 200) : (ERR[code] || '리포트를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.');
  } finally {
    reportBusy = false; renderReports();
  }
}
function autoReport() {
  if (newTurns() < 2) return;
  S.noteMode = 'reports'; save();
  renderNotes(); open('sheetNotes');
  makeReport();
}
function reportCard(r) {

  const d = new Date(r.ts);
  card.append(el('div', 'rmeta', `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} · ${ch ? ch.k : ''} · ${sc ? sc.ko : ''} · ${LANG_KO[r.lang]}`));
  card.append(el('div', 'rsum', r.summary));
  if (r.mistakes.length) {
    const sec = el('div', 'rsec'); sec.append(el('h3', '', '고쳐 말하기'));
    for (const m of r.mistakes) {
      const it = el('div', 'ritem'), t = el('div', 'rt');
      if (m.said) { const a = el('div', 'rs', m.said); a.lang = r.lang; t.append(a); }
      const b = el('div', 'rx', m.better); b.lang = r.lang; t.append(b);

  if (r.expressions.length) {

      it.append(t, actBtn('speaker', '듣기', () => say(x.text, r.lang, { avatar: false })), saveBtn({ lang: r.lang, text: x.text, reading: x.reading, ko: x.ko }));

    sec.append(all);
    card.append(sec);

    const t = el('div', 'nt');
    const x = el('div', 'nx', n.text); x.lang = n.lang; t.append(x);
    if (n.lang === 'ja' && n.reading && n.reading !== n.text) { const r = el('div', 'nr', n.reading); r.lang = 'ja'; t.append(r); }
    if (n.ko) t.append(el('div', 'nk', n.ko));
    const play = actBtn('speaker', '듣기', () => say(n.text, n.lang, { avatar: false }));
    const del = actBtn('trash', '노트에서 지우기', () => { toggleNote(n); renderNotes(); renderLog(); });
    li.append(t, play, del); list.append(li);
  }
}
$('#notesBtn').prepend(icon('book'));
$('#notesBtn').addEventListener('click', () => { renderNotes(); open('sheetNotes'); });

/* ---------- hands-free conversation (standalone page with a microphone) ---------- */
const HF = (() => {
  let on = false, phase = 'off', rec = null, heard = '', session = '', note = '';
  let silenceT = 0, restartT = 0, idleT = 0;
  const live = $('#live'), btn = $('#callBtn');
  const available = () => !IN_CLAUDE && !!SRClass;
  function lastThem() { const log = getLog(); for (let i = log.length - 1; i >= 0; i--) if (log[i].who === 'them') return log[i]; return null; }
  function render() {
    btn.dataset.on = on ? 'true' : 'false';
    btn.textContent = '';
    btn.append(icon(on ? 'stop' : 'mic', 20, on), el('span', '', on ? '대화 끝내기' : '대화 시작'));
    btn.disabled = !!blocked && !on;
    live.textContent = '';
    if (!on) { live.hidden = !note; if (note) live.append(el('div', 'ls', note)); return; }
    live.hidden = false;
    const c = CH(), text = (heard + ' ' + session).trim();
    const st = el('div', 'ls');
    if (phase === 'listening') st.append(el('i', 'dot'), el('span', '', text ? `말이 끝나면 ${S.waitSec}초 뒤에 보내요` : `듣고 있어요 — ${LANG_KO[c.lang]}로 말해 보세요`));
    else if (phase === 'thinking') st.append(el('span', '', `${c.k}가 생각하고 있어요`));
    else st.append(el('span', '', `${c.k}가 말하고 있어요`));
    live.append(st);
    if (phase === 'listening' && text) {
      const t = el('div', 'lt', text); t.lang = c.lang; live.append(t);
      const bar = el('div', 'bar'); bar.append(el('i')); live.style.setProperty('--wait', S.waitSec + 's'); live.append(bar);
    }
  }
  function setPhase(p) { phase = p; render(); }
  function stopRec() { const r = rec; rec = null; if (r) { try { r.abort(); } catch (e) { /* already stopped */ } } }
  function fail(code) {
    stop();
    note = code === 'not-allowed' || code === 'service-not-allowed'
      ? '마이크 사용이 막혀 있어요. 주소창 자물쇠(사이트 설정)에서 마이크를 허용한 뒤 다시 눌러 주세요.'
      : code === 'audio-capture' ? '마이크를 찾지 못했어요.' : '음성 인식을 시작하지 못했어요.';
    render();
  }
  function startRec() {
    stopRec();
    if (!on || phase !== 'listening') return;
    let r;
    try { r = new SRClass(); } catch (e) { fail('start'); return; }
    rec = r;
    r.lang = ttsLang(CH().lang); r.continuous = false; r.interimResults = true; r.maxAlternatives = 1;
    r.onresult = e => {
      if (rec !== r) return;
      let t = '';
      for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      session = t.trim();
      armSilence(); render();
    };
    r.onerror = e => { if (rec === r && (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture')) fail(e.error); };
    r.onend = () => {
      if (rec !== r) return;
      rec = null;
      if (session) { heard = (heard + ' ' + session).trim(); session = ''; }
      if (on && phase === 'listening') { clearTimeout(restartT); restartT = setTimeout(startRec, 150); }
    };
    try { r.start(); } catch (e) { fail('start'); }
  }
  function armSilence() {
    clearTimeout(silenceT); clearTimeout(idleT);
    if ((heard + session).trim()) silenceT = setTimeout(finish, S.waitSec * 1000);
  }
  function armIdle() {
    clearTimeout(idleT);
    idleT = setTimeout(() => { if (on && phase === 'listening' && !(heard + session).trim()) { stop(); note = '한동안 말이 없어서 대화를 멈췄어요. 다시 하려면 대화 시작을 누르세요.'; render(); } }, 90000);
  }
  function finish() {
    const text = (heard + ' ' + session).trim();
    if (!on || phase !== 'listening' || !text) return;
    heard = ''; session = '';
    setPhase('thinking'); stopRec(); clearTimeout(idleT);
    send(text);
  }
  function listen() {
    if (!on) return;
    if (busy || AV.isTalking()) { clearTimeout(restartT); restartT = setTimeout(listen, 300); return; }
    heard = ''; session = '';
    setPhase('listening'); startRec(); armIdle();
  }
  function resume() { if (!on) return; clearTimeout(restartT); restartT = setTimeout(listen, 300); }
  function hold() { if (!on) return; clearTimeout(silenceT); stopRec(); setPhase('speaking'); }
  function speaking() { if (on) { stopRec(); setPhase('speaking'); } }
  function start() {
    if (on || !available()) return;
    if (blocked) { renderBanner(); return; }
    on = true; note = ''; heard = ''; session = '';
    TTS.unlock(); showHints(false);
    const log = getLog(), last = log[log.length - 1];
    if (busy) { setPhase('thinking'); return; }
    if (last && last.who === 'me') { setPhase('thinking'); ask(); return; }
    const t = lastThem();
    if (t) { setPhase('speaking'); say(t.text, CH().lang, { onDone: resume }); } else listen();
  }
  function stop() {
    clearTimeout(silenceT); clearTimeout(restartT); clearTimeout(idleT);
    stopRec(); heard = ''; session = '';
    if (on) { on = false; TTS.stop(); AV.setTalking(false); }
    phase = 'off'; render();
  }
  btn.addEventListener('click', () => { if (on) { stop(); autoReport(); } else start(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && on) stop(); });
  return { available, render, start, stop, resume, hold, speaking, isOn: () => on, listening: () => on && phase === 'listening' };
})();

/* ---------- composer ---------- */
const msg = $('#msg');
function autosize() { msg.style.height = 'auto'; const h = msg.scrollHeight + 2; msg.style.height = Math.min(h, 124) + 'px'; msg.style.overflowY = h > 124 ? 'auto' : 'hidden'; }
function armAutoSend() {
  const AUTO_MS = S.waitSec * 1000;
  clearTimeout(autoT);
  const sb = $('#sendBtn'); sb.classList.remove('arming');
  if (S.mode !== 'call' || !S.autoSend || busy || blocked || !msg.value.trim()) return;
  void sb.offsetWidth; sb.style.setProperty('--arm', AUTO_MS + 'ms'); sb.classList.add('arming');
  autoT = setTimeout(() => {
    sb.classList.remove('arming');
    if (busy || !msg.value.trim()) return;
    msg.blur();
    setTimeout(() => send(), 80);
  }, AUTO_MS);
}
msg.addEventListener('input', () => { autosize(); armAutoSend(); updateTurn(); });
msg.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
});
$('#composer').addEventListener('submit', e => {
  e.preventDefault();
  if (busy) { if (ctl) ctl.abort(); return; }
  send();
});
$('#hintBtn').appendChild(icon('bulb'));
$('#hintBtn').addEventListener('click', () => showHints($('#hints').hidden));
$('#whoCaret').appendChild(icon('caret', 18));
const tip = $('#tip');
const tipText = el('span', ''); tipText.id = 'tipText'; tip.append(icon('mic', 14), tipText);
$('#modeCall').appendChild(icon('phone', 18)); $('#modeChat').appendChild(icon('chat', 18));
$('#modeCall').addEventListener('click', () => { if (S.mode === 'call') return; S.mode = 'call'; save(); applyMode(); greetIfFresh(); });
$('#modeChat').addEventListener('click', () => { if (S.mode !== 'call') return; S.mode = 'chat'; save(); clearTimeout(autoT); $('#sendBtn').classList.remove('arming'); applyMode(); });

setBusyUI(false);
renderBadge();
applyChar();
renderBanner();
})();
</script>
